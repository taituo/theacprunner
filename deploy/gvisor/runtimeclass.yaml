# gVisor RuntimeClass (requires runsc installed and configured in containerd on the nodes,
# e.g. GKE Sandbox, or https://gvisor.dev/docs/user_guide/containerd/quick_start/).
# Enable per runner class with `spec.runtimeClassName: gvisor`. Not needed on KIND.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
