# opencode through the generic ACP driver: the launch is all acp-runner knows about it.
# Profile and findings: drivers.lock.yaml (profiles: opencode), conformance/.
apiVersion: acp-runner.dev/v1alpha1
kind: ACPRunnerClass
metadata: {name: opencode, namespace: acp-agents}
spec:
  driver: acp
  image: acp-runner/runner:dev          # production: a digest-pinned image (ACP_RUNNER_ALLOWED_IMAGES)
  launch:
    command: opencode
    args: [acp, --pure]                 # --pure: no external plugins from the repository
    env:
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
      # Highest precedence (beats the repository's opencode.json): default model and the
      # provider endpoint, so a repository cannot redirect the API key.
      OPENCODE_CONFIG_CONTENT: '{"model": "openai/gpt-5-mini", "provider": {"openai": {"options": {"baseURL": "https://api.openai.com/v1"}}}}'
    files:
      - target: .config/opencode/opencode.json
        content: '{"autoupdate": false, "share": "disabled", "permission": {"edit": "allow", "bash": "allow"}}'
  allowRunOverrides: true
  credentials:
    provider: files                     # acp-runnerctl auth enroll files openai-test --from-file ... --select openai
    profiles: [openai-test]
    fileTargets: {auth.json: .local/share/opencode/auth.json}
  egress:
    mode: proxy
    httpsProxy: http://acp-egress-proxy.acp-egress.svc:3128
