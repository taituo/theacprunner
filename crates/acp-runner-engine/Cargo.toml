[package]
name = "acp-runner-engine"
description = "Backend-agnostic run engine: attempt planning, supervision, timeouts, retry/fallback, resume capsules, ingest API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
acp-runner-core.workspace = true
acp-runner-ipc.workspace = true
